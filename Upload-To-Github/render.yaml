services:
  - type: web
    name: copycat-copiers-printing
    runtime: node
    plan: free
    region: singapore # closest free region to India for fast mobile loading
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      - key: IS_CLOUD
        value: "true"
      - key: BRIDGE_TOKEN
        value: copycat_bridge_key_2026
